name: Build

# Compila ZimbraViewer per Windows, macOS (Apple Silicon e Intel) e Linux.
# - Avvio manuale: scheda Actions -> Build -> Run workflow (i pacchetti si scaricano dagli "Artifacts" della run)
# - Tag "v*" (es. v3.2.0): oltre agli artifacts crea una Release con tutti i pacchetti allegati
# - Avvio manuale con "release" compilato (es. v3.2.0): GitHub crea il tag sul commit compilato e la Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag della Release da creare (es. v3.2.0); vuoto = solo artifacts"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows-x64
          - os: macos-15
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-x86_64
          # glibc 2.35: l'AppImage gira su Debian 12+, Ubuntu 22.04+, Fedora 36+, Arch, openSUSE Tumbleweed...
          - os: ubuntu-22.04
            nome: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libfontconfig1 \
            libdbus-1-3 file desktop-file-utils

      - name: Trusted List AgID aggiornata da includere nel pacchetto (copia offline)
        shell: bash
        run: |
          curl -fsSL --retry 3 -o TSL-IT.xml https://eidas.agid.gov.it/TL/TSL-IT.xml && grep -q TrustServiceStatusList TSL-IT.xml \
            || { echo "::warning::Trusted List non scaricata: il pacchetto la scaricherà al primo avvio"; rm -f TSL-IT.xml; }

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          NO_VENV: "1"
          PYTHON: python
        run: bash ./build_zimbra.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 PyQt6-WebEngine asn1crypto pyhanko pyhanko-certvalidator cryptography lxml olefile certifi tzdata
          python -m pip install libpff-python
          if ($LASTEXITCODE -ne 0) { Write-Warning "libpff-python non installato: niente supporto .pst/.ost"; $global:LASTEXITCODE = 0 }
          python -m PyInstaller --noconfirm --clean ZimbraViewer.spec
          $ver = (Select-String -Path "ZimbraViewer *.py" -Pattern 'VERSIONE_APP = "([^"]+)"').Matches[0].Groups[1].Value
          Move-Item dist/ZimbraViewer.exe "dist/ZimbraViewer-$ver-windows-x64.exe"

      - name: Prova di avvio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 25 xvfb-run -a dist/*.AppImage || [ $? -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: ZimbraViewer-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note della release (docs/release/<tag>.md, se c'è)
        env:
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if [ -f "docs/release/$TAG.md" ]; then cp "docs/release/$TAG.md" note.md; else : > note.md; fi
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ZimbraViewer ${{ inputs.release || github.ref_name }}
          files: pacchetti/*
          body_path: note.md
          generate_release_notes: true
